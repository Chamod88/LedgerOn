server.port=8083
spring.application.name=fraud-engine

# PostgreSQL connection details
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=ledger_user
spring.datasource.password=ledger_password
spring.jpa.hibernate.ddl-auto=update

# Redis connection details (Feature Store)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka connection details
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fraud-group
spring.kafka.consumer.auto-offset-reset=earliest

# Logging Configuration with Correlation ID (MDC)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name:},%X{correlationId:-}] [%thread] %logger{36} : %msg%n

# Actuator — expose health endpoint for Docker/K8s probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
