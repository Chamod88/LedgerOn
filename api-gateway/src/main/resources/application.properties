# Port to run this service on (must not conflict with 8080)
spring.application.name=api-gateway
server.port=8082

# PostgreSQL connection details
spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=ledger_user
spring.datasource.password=ledger_password

# Database schema management (safety first!)
spring.jpa.hibernate.ddl-auto=none

# Kafka connection details
spring.kafka.bootstrap-servers=localhost:9092
# Consumer group identification
spring.kafka.consumer.group-id=ledger-group

# Logging Configuration with Correlation ID (MDC)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name:},%X{correlationId:-}] [%thread] %logger{36} : %msg%n

# Actuator — expose health endpoint for Docker/K8s probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Error handling - show detailed validation errors for debugging
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# JWT Configuration
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
jwt.expiration-ms=86400000

# Rate Limiting Configuration
rate-limiter.replenish-rate=50
rate-limiter.burst-capacity=100

# Dynamic Routing Configuration
routes.user-service=http://localhost:8081
routes.payment-service=http://localhost:8083
routes.ledger-service=http://localhost:8080
